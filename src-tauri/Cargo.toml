[package]
name = "audio-plumber"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

# Legacy Tauri webview binary (removed in the final pivot step).
[[bin]]
name = "audio-plumber"
path = "src/main.rs"

# Native egui/eframe binary — the pivot target.
[[bin]]
name = "audio-plumber-egui"
path = "src/bin/egui.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
