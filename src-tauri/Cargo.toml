[package]
name = "audio-plumber"
version = "0.1.0"
edition = "2021"
description = "AudioPlumber — a visual PipeWire patchbay with a native egui GUI"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.28", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

# ─── Linux packaging metadata ───────────────────────────────────────────────
# Consumed by `cargo deb` (cargo-deb) to produce a .deb. The app shells out to
# pw-link / pactl / pw-dump at runtime, hence the PipeWire/pulse dependencies.
[package.metadata.deb]
name = "audioplumber"
maintainer = "AudioPlumber"
copyright = "AudioPlumber contributors"
extended-description = "A visual PipeWire patchbay with a native egui GUI."
section = "sound"
priority = "optional"
# pipewire = the daemon; pipewire-bin = pw-link / pw-dump CLI tools;
# pulseaudio-utils = pactl (works against pipewire-pulse).
depends = "libc6, pipewire, pipewire-bin, pulseaudio-utils"
assets = [
    ["target/release/audio-plumber", "usr/bin/audio-plumber", "755"],
    ["../packaging/audioplumber.desktop", "usr/share/applications/audioplumber.desktop", "644"],
    ["icons/128x128.png", "usr/share/icons/hicolor/128x128/apps/audioplumber.png", "644"],
    ["../LICENSE", "usr/share/doc/audioplumber/LICENSE", "644"],
]

# Consumed by `cargo generate-rpm` (cargo-generate-rpm) to produce a .rpm.
[package.metadata.generate-rpm]
name = "audioplumber"
summary = "Visual PipeWire patchbay with a native egui GUI"
# On Fedora: pipewire-utils provides pw-link / pw-dump; pulseaudio-utils
# provides pactl. (pipewire-pulseaudio only supplies the PA replacement
# daemon, NOT the pactl client, so it must not be relied on here.)
requires = { pipewire = "*", "pipewire-utils" = "*", "pulseaudio-utils" = "*" }
# Paths are relative to this manifest's directory (src-tauri); the release
# workflow runs `cargo generate-rpm` from there.
assets = [
    { source = "target/release/audio-plumber", dest = "/usr/bin/audio-plumber", mode = "755" },
    { source = "../packaging/audioplumber.desktop", dest = "/usr/share/applications/audioplumber.desktop", mode = "644" },
    { source = "icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/audioplumber.png", mode = "644" },
    { source = "../LICENSE", dest = "/usr/share/doc/audioplumber/LICENSE", mode = "644", doc = true },
]
