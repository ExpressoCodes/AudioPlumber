name: Release

# Build Linux bundles (.deb, .rpm, .AppImage) and auto-publish a GitHub Release
# whenever a version tag like v1.2.3 is pushed.
#
# AudioPlumber is now a pure-Rust egui/eframe binary (no Tauri, no webview), so
# the bundles are produced directly from the compiled binary with cargo-deb,
# cargo-generate-rpm and linuxdeploy instead of tauri-action.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Build-time libraries for the egui/eframe (glow + winit) stack, plus the
      # AppImage tooling (FUSE + patchelf + file + imagemagick for the icon).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libfuse2 \
            patchelf \
            wget \
            file \
            imagemagick

      - name: Install packagers
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build release binary
        working-directory: src-tauri
        run: cargo build --release

      - name: Build .deb
        working-directory: src-tauri
        run: cargo deb --no-build --output ../audioplumber.deb

      - name: Build .rpm
        working-directory: src-tauri
        run: cargo generate-rpm --output ../audioplumber.rpm

      - name: Build .AppImage
        run: |
          # Lay out an AppDir from the compiled binary + desktop file + icon.
          mkdir -p AppDir/usr/bin
          cp src-tauri/target/release/audio-plumber AppDir/usr/bin/
          install -Dm644 packaging/audioplumber.desktop \
            AppDir/usr/share/applications/audioplumber.desktop
          install -Dm644 src-tauri/icons/128x128.png \
            AppDir/usr/share/icons/hicolor/128x128/apps/audioplumber.png

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage \
            --desktop-file AppDir/usr/share/applications/audioplumber.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/128x128/apps/audioplumber.png
          mv AudioPlumber*.AppImage audioplumber.AppImage || mv ./*.AppImage audioplumber.AppImage

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "AudioPlumber ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            audioplumber.deb
            audioplumber.rpm
            audioplumber.AppImage
