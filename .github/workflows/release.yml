name: Release

# Build Linux bundles (.deb, .rpm, .AppImage) and auto-publish a GitHub Release
# whenever a version tag like v1.2.3 is pushed.
on:
  push:
    tags:
      - "v*"

# tauri-action needs write access to create the Release and upload assets
# using the built-in GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Tauri 2 on Linux needs WebKitGTK 4.1 and the bundler toolchain.
      # `rpm` is required for the .rpm target; AppImage tooling is pulled in by
      # the bundler itself but needs patchelf + librsvg + file present.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            rpm \
            file

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No JS frontend: the Tauri app lives in ./src-tauri and the frontend
          # is static files in ./ui (frontendDist). Pointing projectPath at the
          # repo root lets the action auto-detect the Cargo project in src-tauri
          # without assuming a package.json / npm install / beforeBuildCommand.
          projectPath: .
          # Build all three Linux bundle formats as separate assets.
          args: --bundles deb,rpm,appimage
          # Release config: tag and name derive from the pushed git tag.
          tagName: ${{ github.ref_name }}
          releaseName: "AudioPlumber ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
