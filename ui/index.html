<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AudioPlumber — Visual Patchbay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>AudioPlumber</h1>
    <p class="subtitle">Visual PipeWire Patchbay</p>
    <div class="header-actions">
      <button id="btn-mode-toggle" class="btn-mode-toggle">&#x2699; Advanced</button>
      <button id="btn-refresh" class="btn-refresh">Refresh</button>
    </div>
  </header>

  <!-- Error banner — shown when deps are missing or a critical error occurs -->
  <div id="error-banner" class="error-banner" role="alert" aria-live="assertive" style="display:none">
    <span id="error-banner-msg"></span>
    <button id="error-banner-close" class="error-banner-close" aria-label="Dismiss">&times;</button>
  </div>

  <div class="hint-bar">
    <span>Click a <strong>monitor port</strong> on a virtual sink (left), then an <strong>output port</strong> on the right to connect. Click a <strong>cable</strong> to disconnect.</span>
  </div>

  <div class="patchbay-container" id="patchbay-container">
    <!-- Left column: virtual sinks -->
    <div class="column column-outputs" id="column-outputs">
      <div class="column-header">
        <span class="column-header-title">Virtual Sinks</span>
        <div class="column-header-actions">
          <button id="btn-new-vsink" class="btn-col-action btn-col-action-vsink">&#xFF0B; New Virtual Sink</button>
        </div>
      </div>
      <div class="nodes-list" id="outputs-list"></div>
    </div>

    <div class="cable-zone" aria-hidden="true"></div>

    <!-- SVG cable overlay -->
    <svg class="cable-svg" id="cable-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
    </svg>

    <!-- Right column: real audio outputs (auto-populated) -->
    <div class="column column-inputs" id="column-inputs">
      <div class="column-header">
        <span class="column-header-title">Outputs (auto)</span>
      </div>
      <div class="nodes-list" id="inputs-list"></div>
    </div>
  </div>

  <!-- Virtual Sink Modal -->
  <div class="modal-overlay" id="modal-vsink" style="display:none" role="dialog" aria-modal="true">
    <div class="modal-card modal-card-sm">
      <div class="modal-title">New Virtual Sink</div>
      <div class="modal-vsink-form">
        <label for="vsink-name-input" class="modal-vsink-label">Name</label>
        <input type="text" id="vsink-name-input" class="modal-vsink-input" placeholder="e.g. Recording Mix" maxlength="64" />
      </div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" id="modal-vsink-cancel">Cancel</button>
        <button class="btn-modal-confirm" id="modal-vsink-confirm">Create</button>
      </div>
    </div>
  </div>

  <!-- Debug panel — hidden by default, toggle with D key -->
  <pre id="debug-panel" class="debug-panel" style="display:none"></pre>

  <script src="main.js"></script>
</body>
</html>
